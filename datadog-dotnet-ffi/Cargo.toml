# SPDX-License-Identifier: Apache-2.0

[package]
name = "datadog-dotnet-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "Apache-2.0"
publish = false
description = "The libdatadog library shipped with the .NET tracer: libdatadog's profiling FFI plus .NET specific FFI"

[lib]
# Shipped as libdatadog_profiling.{so,dylib} / datadog_profiling_ffi.dll, see build.sh / build.ps1.
# The name must differ from libdd-profiling-ffi's own library to avoid colliding outputs.
name = "datadog_dotnet_ffi"
crate-type = ["cdylib"]
bench = false

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
function_name = { version = "0.3.0", default-features = false }
strum = { version = "0.26", default-features = false }
tokio = { version = "1.49", default-features = false, features = ["macros", "net", "rt", "time"] }
tokio-util = { version = "0.7.11", default-features = false }

libdd-capabilities-impl = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false }
# std for Endpoint
libdd-common = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false, features = ["std"] }
libdd-common-ffi = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false, features = ["std"] }
# https for https:// agent urls
libdd-remote-config = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false, features = ["client", "https"] }
# Must be the feature list the libdatadog builder computes for the libdatadog-dotnet builder
# features (FEATURES in build.sh / build.ps1), see builder/src/features.rs, minus cbindgen (the
# headers come from the builder), plus catch_panic (a builder default that --no-default-features drops).
libdd-profiling-ffi = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false, features = [
  "ddcommon-ffi",
  "catch_panic",
  "crashtracker-ffi",
  "crashtracker-collector",
  "crashtracker-receiver",
  "demangler",
  "symbolizer",
  "datadog-library-config-ffi",
] }

[build-dependencies]
# The Windows VERSIONINFO of the DLL, as libdd-profiling-ffi's build.rs embeds it in its own DLL
build_common = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", features = ["winresource"] }

[dev-dependencies]
base64 = "0.22"
http = "1"
libdd-remote-config = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0", default-features = false, features = ["client", "test"] }
libdd-trace-protobuf = { git = "https://github.com/DataDog/libdatadog", tag = "v48.0.0" }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.49", default-features = false, features = ["rt-multi-thread"] }
