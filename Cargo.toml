# SPDX-License-Identifier: Apache-2.0
#
# ./libdatadog is the libdatadog checkout build.sh / build.ps1 install the builder from.

[workspace]
members = ["datadog-dotnet-ffi"]
exclude = ["libdatadog"]
resolver = "2"

# Same as libdatadog's release profile, which the builder uses for the profiling library.
[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = true
opt-level = "s"
