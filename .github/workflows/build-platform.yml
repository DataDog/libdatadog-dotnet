name: Build Platform

on:
  workflow_call:
    inputs:
      features:
        description: 'Comma-separated builder crate features (e.g. profiling,crashtracker,symbolizer,library-config)'
        required: false
        type: string
        default: 'profiling,crashtracker,symbolizer,library-config'
      verify_artifacts:
        description: 'Whether to verify build artifacts after building'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - platform: x64-windows
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - platform: x86-windows
            target: i686-pc-windows-msvc
            os: windows-latest
          # Linux x64 builds
          - platform: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: x86_64-alpine-linux-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 builds
          - platform: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: aarch64-alpine-linux-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS builds — pinned to Sonoma (macos-14) to match libdatadog's
          # libddprof-build pipeline and keep a lower minimum-OS baseline at
          # link time than building on Sequoia would produce.
          - platform: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-14-large
          - platform: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pin to libdatadog's MSRV (see rust-version in its workspace Cargo.toml).
      # Building with the same toolchain version libdatadog itself uses avoids
      # subtle codegen / inlining differences between releases.
      - name: Setup Rust
        run: |
          rustup install 1.87.0
          rustup default 1.87.0

      - name: Add Windows target
        if: runner.os == 'Windows'
        run: rustup target add ${{ matrix.target }}

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry and git
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('LIBDATADOG_VERSION') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # libdatadog itself builds aarch64 (gnu and musl) by running the
      # builder natively under QEMU emulation (see docker-bake.hcl in
      # DataDog/libdatadog).  We mirror that pattern so target = host inside
      # the container — required since libdd-libunwind-sys's build.rs runs
      # ./configure + make with no cross-compile wiring.
      - name: Set up QEMU
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Build ${{ matrix.platform }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pwsh -Command "./build.ps1 -Platform '${{ matrix.platform }}' -Features '${{ inputs.features }}' -Clean"
          else
            chmod +x build.sh
            ./build.sh --platform "${{ matrix.platform }}" --features "${{ inputs.features }}" --clean
          fi
        shell: bash

      - name: Verify build artifacts
        if: inputs.verify_artifacts
        run: |
          output_dir="output/libdatadog-${{ matrix.platform }}"

          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows ships the legacy layout (release/{dynamic,static},
            # debug/{dynamic,static}) with _ffi-suffixed filenames so it
            # matches what dd-trace-dotnet's vcpkg portfile and runtime
            # DLL loader expect — see build.ps1 for details.
            if [ ! -f "$output_dir/release/dynamic/datadog_profiling_ffi.dll" ]; then
              echo "Error: DLL not found at $output_dir/release/dynamic/datadog_profiling_ffi.dll"
              exit 1
            fi
          else
            if [ ! -f "$output_dir/lib/libdatadog_profiling.so" ] && \
               [ ! -f "$output_dir/lib/libdatadog_profiling.dylib" ]; then
              echo "Error: Shared library not found in $output_dir/lib/"
              exit 1
            fi
          fi

          if [ ! -d "$output_dir/include/datadog" ] || \
             [ -z "$(ls -A $output_dir/include/datadog)" ]; then
            echo "Error: Headers not found in $output_dir/include/datadog/"
            exit 1
          fi

          if [ ! -f "$output_dir/LICENSE" ]; then
            echo "Error: LICENSE not found in $output_dir/"
            exit 1
          fi

          echo "Build artifacts verified successfully!"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: libdatadog-${{ matrix.platform }}
          path: output/libdatadog-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
