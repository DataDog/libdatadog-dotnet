name: Build Platform

on:
  workflow_call:
    inputs:
      verify_artifacts:
        description: 'Whether to verify build artifacts after building'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          - platform: x64-windows
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - platform: x86-windows
            target: i686-pc-windows-msvc
            os: windows-latest
          # Linux x64 builds
          - platform: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: x86_64-alpine-linux-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Linux ARM64 builds
          - platform: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: aarch64-alpine-linux-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS builds
          - platform: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-15-large
          - platform: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Add Windows target
        if: runner.os == 'Windows'
        run: rustup target add ${{ matrix.target }}

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry and git
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('LIBDATADOG_VERSION') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build ${{ matrix.platform }}
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pwsh -Command "./build.ps1 -Platform '${{ matrix.platform }}' -Clean"
          else
            chmod +x build.sh
            ./build.sh --platform "${{ matrix.platform }}" --clean
          fi
        shell: bash

      - name: Verify build artifacts
        if: inputs.verify_artifacts
        run: |
          output_dir="output/libdatadog-${{ matrix.platform }}"

          if [ "$RUNNER_OS" == "Windows" ]; then
            if [ ! -f "$output_dir/lib/datadog_profiling.dll" ]; then
              echo "Error: DLL not found at $output_dir/lib/datadog_profiling.dll"
              exit 1
            fi
          else
            if [ ! -f "$output_dir/lib/libdatadog_profiling.so" ] && \
               [ ! -f "$output_dir/lib/libdatadog_profiling.dylib" ]; then
              echo "Error: Shared library not found in $output_dir/lib/"
              exit 1
            fi
          fi

          if [ ! -d "$output_dir/include/datadog" ] || \
             [ -z "$(ls -A $output_dir/include/datadog)" ]; then
            echo "Error: Headers not found in $output_dir/include/datadog/"
            exit 1
          fi

          if [ ! -f "$output_dir/LICENSE" ]; then
            echo "Error: LICENSE not found in $output_dir/"
            exit 1
          fi

          echo "Build artifacts verified successfully!"
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: libdatadog-${{ matrix.platform }}
          path: output/libdatadog-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
